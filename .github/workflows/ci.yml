name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: matrix.node-version == env.NODE_VERSION
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  security:
    name: Dependency and IaC scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fail on high or critical advisories
        run: npm run audit:ci

      - name: Scan repository for secrets and vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,config
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive -diff terraform

      - name: Validate Terraform configuration
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

  container:
    name: Build and scan image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          push: false
          tags: cloud-infra-cicd-pipeline:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: cloud-infra-cicd-pipeline:ci-${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Runs the real image against real Postgres and Redis so the smoke test
      # also proves the schema bootstrap and secret injection path work.
      - name: Run the image against Postgres and Redis
        run: |
          docker run --detach --name api-smoke --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_URL="postgres://app:localdev@127.0.0.1:5432/app" \
            -e REDIS_URL="redis://127.0.0.1:6379" \
            cloud-infra-cicd-pipeline:ci-${{ github.sha }}

          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null && curl -fsS http://127.0.0.1:3000/ready; then
              echo "container is healthy and ready"
              exit 0
            fi
            sleep 3
          done

          echo "container did not become ready"
          docker logs api-smoke || true
          exit 1

      - name: Verify graceful shutdown (SIGTERM drains cleanly)
        if: always()
        run: |
          if ! docker inspect api-smoke >/dev/null 2>&1; then
            echo "no container to inspect"
            exit 0
          fi
          docker stop --time 30 api-smoke
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' api-smoke)"
          echo "exit code after SIGTERM: ${exit_code}"
          docker rm -f api-smoke || true
          test "${exit_code}" = "0"
